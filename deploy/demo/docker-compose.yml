# =============================================================================
#  演示环境部署（2 核 2G 小机器专用）
#
#  与 deploy/docker-compose.yml 的区别：
#    那个是"源码构建版"（服务器上装 JDK/Maven/Node 现场编译），适合大机器或 CI；
#    这个是"轻量运行版"——jar 包和前端产物在本地编译好一起上传，
#    服务器只装 Docker，启动快、内存占用低，2G 机器扛得住。
#
#  用法（在服务器上）：
#    cd /opt/followup
#    docker compose up -d
#    docker compose ps
# =============================================================================

name: followup-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- 数据库
  postgres:
    image: postgres:16.10-alpine
    container_name: followup-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?please set DB_SUPERUSER_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      APP_DB_USER: ${DB_APP_USER}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?please set DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时按顺序建表、加固患者端策略、建索引（数据目录非空则跳过）
      - ./sql/V1__init_schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/V2__patient_portal_rls.sql:/docker-entrypoint-initdb.d/11-patient-rls.sql:ro
      - ./sql/V3__hot_query_indexes.sql:/docker-entrypoint-initdb.d/12-indexes.sql:ro
      # 【必须挂成文件，不能挂成目录】
      # PostgreSQL 的初始化脚本只会执行 .sh / .sql 文件，
      # 挂成目录（/docker-entrypoint-initdb.d/20-init）会被直接跳过，
      # 结果是 app_rw 的密码还是建表脚本里的占位符，应用连不上数据库。
      - ./init/20-init-app-user.sh:/docker-entrypoint-initdb.d/20-init-app-user.sh:ro
    # 内存按 2G 机器收紧；换 4G 机器可调回 512MB / 1536MB
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks: [backend]
    # 数据库不映射端口，只在 Docker 内网可见

  # ---------------------------------------------------------------- 缓存
  redis:
    image: redis:7.4-alpine
    container_name: followup-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?please set REDIS_PASSWORD in .env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging
    networks: [backend]

  # ---------------------------------------------------------------- 后端应用
  app:
    # 用带时区数据的 Debian 版基础镜像：alpine 版缺 tzdata，
    # 会导致 Asia/Shanghai 解析失败、逾期天数算错。
    image: eclipse-temurin:21-jre
    container_name: followup-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 8
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 迁移必须用超级用户：V1 要建扩展和角色，V2 要改行级安全策略，V3 要建索引，
      # 这些都需要表属主权限，用应用账号 app_rw 会直接失败、应用起不来。
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_FLYWAY_USER: ${DB_SUPERUSER}
      SPRING_FLYWAY_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      # 密钥：必须显式设置。代码里的默认值是开发用的公开串，
      # 生产漏配等于任何人可以伪造登录令牌。
      APP_CRYPTO_DATA_KEY: ${APP_CRYPTO_DATA_KEY:?please set APP_CRYPTO_DATA_KEY in .env}
      APP_CRYPTO_HASH_PEPPER: ${APP_CRYPTO_HASH_PEPPER:?please set APP_CRYPTO_HASH_PEPPER in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?please set APP_JWT_SECRET in .env}
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8
    volumes:
      - ./app.jar:/app/app.jar:ro
      - applogs:/app/logs
    # $$ 是转义：让 $JAVA_OPTS 由容器内的 shell 展开，而不是被 compose 提前替换掉
    command: ["sh", "-c", "exec java $${JAVA_OPTS} -jar /app/app.jar"]
    expose:
      - "8080"
    logging: *default-logging
    networks: [backend]

  # ---------------------------------------------------------------- 反向代理 + 静态页面
  nginx:
    image: nginx:1.27-alpine
    container_name: followup-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/followup.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www/staff:/var/www/followup/staff:ro
      - ./www/patient:/var/www/followup/patient:ro
      - ./www/admin:/var/www/followup/admin:ro
    environment:
      TZ: Asia/Shanghai
    logging: *default-logging
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  applogs:
