# =============================================================================
#  随访系统 · Nginx 配置（HTTP 引导版 · 只在"第一次签证书"时用几分钟）
#
#  为什么需要它：nginx 只要在配置里看到 ssl_certificate，而证书文件不存在，
#  整个 nginx 就起不来（不是那一个站点起不来，是整站挂掉）。
#  所以第一次装证书的顺序必须是：
#      先用本文件顶上去（80 上照常跑业务，网站不中断）
#        → certbot 通过 80 端口校验、签发证书
#        → 再用 followup-https.conf 覆盖回去，reload 生效
#  平时这份文件不生效，不用管它。全部由 https/install-https.sh 自动切换。
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    charset utf-8;
    client_max_body_size 20m;

    # 病历与联系方式属于敏感数据，禁止被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 证书校验目录【^~ 是必须的，见 followup-https.conf 里的说明】
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # ---------------------------------------------------------------- 健康检查
    location = /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
    }

    # ---------------------------------------------------------------- 后端接口
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ---------------------------------------------------------------- 管理后台
    location /admin/ {
        root /var/www/followup;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ---------------------------------------------------------------- 患者端
    location /patient/ {
        root /var/www/followup;
        try_files $uri $uri/ /patient/index.html;
        expires -1;
    }

    # ---------------------------------------------------------------- 医护端（默认）
    location / {
        root /var/www/followup/staff;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 带指纹的静态资源可以长缓存
    location /assets/ {
        root /var/www/followup/staff;
        expires 30d;
        access_log off;
    }

    location /patient/assets/ {
        root /var/www/followup;
        expires 30d;
        access_log off;
    }

    location /admin/assets/ {
        root /var/www/followup;
        expires 30d;
        access_log off;
    }

    location /photos/ {
        root /var/www/followup/staff;
        expires 7d;
        access_log off;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
