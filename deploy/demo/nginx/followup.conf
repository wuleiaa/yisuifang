# =============================================================================
#  随访系统 · Nginx 配置（HTTPS 正式版）
#
#  这份内容在服务器上有两份一模一样的拷贝，改的时候别只改一个：
#      nginx/followup.conf        ← docker-compose.yml 挂载的就是它（当前生效的那份）
#      nginx/followup-https.conf  ← 安装脚本 https/install-https.sh 从这里取"正式版"
#  改完同步一下：
#      cp nginx/followup-https.conf nginx/followup.conf
#
#  为什么要有"引导版"：第一次签证书时证书文件还不存在，而 nginx 只要看到
#  ssl_certificate 指向不存在的文件就会整站起不来。安装脚本的切换顺序见
#  nginx/followup-http-only.conf 里的说明。
#
#  端口分工：
#    80  → ① 给 Let's Encrypt 做校验 ② 其余全部 301 跳 https
#    443 → 全部业务
#
#  三个前端 + 一个后端共用一个域名，用路径区分：
#    /          → 医护端 App（手机）
#    /patient/  → 患者端 H5（手机）
#    /admin/    → 管理后台（桌面）
#    /api/      → 后端接口
#
#  证书（宿主机 ./nginx/letsencrypt，容器内 /etc/letsencrypt）：
#    由 https/install-https.sh 签发，由 https/renew-cert.sh 每周自动续期。
# =============================================================================

# ---------------------------------------------------------------- 80：校验 + 跳转
server {
    listen      80;
    listen      [::]:80;
    server_name yisuifang.work www.yisuifang.work;

    charset utf-8;
    client_max_body_size 20m;

    # 【必须用 ^~，不能只用普通前缀】
    # nginx 的匹配顺序是"最长前缀 → 正则"，而本文件末尾有
    # location ~ /\. { deny all }（拦 .env、.git）。那个正则会抢在普通前缀前面
    # 命中 /.well-known/acme-challenge/xxx，结果是 certbot 永远收到 404、证书续不了。
    # ^~ 的含义是"命中该前缀后不再试正则"，正好避开这个坑。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        # 固定跳到主域名：写成 $host 的话，用 IP 访问会跳到一个"没有证书的地址"，
        # 浏览器照样弹安全警告。
        return 301 https://yisuifang.work$request_uri;
    }

    # 隐藏文件一律拒绝（.env、.git 等）
    location ~ /\. {
        deny all;
        return 404;
    }
}

# ---------------------------------------------------------------- 443：全部业务
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name yisuifang.work www.yisuifang.work;

    ssl_certificate     /etc/letsencrypt/live/yisuifang.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yisuifang.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    charset utf-8;
    client_max_body_size 20m;

    # 病历与联系方式属于敏感数据，禁止被搜索引擎收录。
    # 【注意】下面各 location 里没有再写 add_header：
    # nginx 的规矩是"location 里只要出现一条 add_header，server 级的一律不继承"，
    # 在 location 里加缓存头会把这几条安全头悄悄弄丢。
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------------------------------------------------------- 健康检查
    location = /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
    }

    # ---------------------------------------------------------------- 后端接口
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ---------------------------------------------------------------- 管理后台（桌面）
    # 【必须用 root 而不是 alias】alias 与 try_files 同用会拼错路径
    # （变成 /var/www/followup/admin/admin/index.html）→ 404。
    # expires -1 等价于 Cache-Control: no-cache：index.html 每次都要回源校验，
    # 这样发了新前端以后用户刷新就能拿到新版本（Vite 产物文件名带指纹，
    # 老文件还在磁盘上，所以最多是"慢一拍"，不会白屏）。
    location /admin/ {
        root /var/www/followup;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ---------------------------------------------------------------- 患者端 H5
    location /patient/ {
        root /var/www/followup;
        try_files $uri $uri/ /patient/index.html;
        expires -1;
    }

    # ---------------------------------------------------------------- 医护端（手机 App，默认站点）
    location / {
        root /var/www/followup/staff;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # ---------------------------------------------------------------- 带指纹的静态资源
    # Vite 产物文件名带内容指纹，改了内容就换名字，可以放心长缓存。
    # 用普通前缀而不是正则 location（正则容易被末尾的 deny 规则误伤）。
    location /assets/ {
        root /var/www/followup/staff;
        expires 30d;
        access_log off;
    }

    location /patient/assets/ {
        root /var/www/followup;
        expires 30d;
        access_log off;
    }

    location /admin/assets/ {
        root /var/www/followup;
        expires 30d;
        access_log off;
    }

    # 三个端的照片都放在各自的 /photos/ 里，走的又是同一个域名根路径，
    # 所以一条规则就够；照片不常改，但也没有指纹，缓存一周比较稳。
    location /photos/ {
        root /var/www/followup/staff;
        expires 7d;
        access_log off;
    }

    # 隐藏文件一律拒绝（.env、.git 等）
    location ~ /\. {
        deny all;
        return 404;
    }
}
