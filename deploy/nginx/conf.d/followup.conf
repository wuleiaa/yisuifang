# =============================================================================
#  医院随访管理系统 · Nginx 配置
#
#  三个前端 + 一个后端，共用一个域名，用路径区分：
#    /            → 医护端 App（手机）
#    /patient/    → 患者端 H5（手机）
#    /admin/      → 管理后台（桌面）
#    /api/        → 后端接口
#
#  端口：80 只用于证书签发与跳转；业务全部走 443。
#  占位符 ${SERVER_NAME} 由容器启动时的 envsubst 替换（见 docker-compose.yml）。
#
#  【重要】前端构建产物必须放在：
#    /var/www/followup/staff     ← frontend/dist
#    /var/www/followup/patient   ← frontend/dist-patient
#    /var/www/followup/admin     ← frontend/dist-admin
#  三个前端都用 hash 路由，所以刷新任意子路径都由 index.html 兜底，不需要额外 rewrite。
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name ${SERVER_NAME};

    # 证书签发用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 病历与联系方式属于敏感数据，禁止被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
    charset utf-8;

    # ---------------------------------------------------------------- 健康检查
    location = /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
    }

    # ---------------------------------------------------------------- 后端接口
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ---------------------------------------------------------------- 管理后台（桌面）
    # 【必须用 root 而不是 alias】alias 与 try_files 同用会拼错路径
    # （变成 /var/www/followup/admin/admin/index.html），表现为 404。
    location /admin/ {
        root /var/www/followup;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ---------------------------------------------------------------- 患者端 H5
    location /patient/ {
        root /var/www/followup;
        try_files $uri $uri/ /patient/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ---------------------------------------------------------------- 医护端（手机 App，默认站点）
    location / {
        root /var/www/followup/staff;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 带指纹的静态资源可以长缓存；index.html 必须每次校验
    location ~* ^/(patient/|admin/)?assets/.*\.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        root /var/www/followup/staff;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 隐藏文件一律拒绝（.env、.git 等）
    location ~ /\. {
        deny all;
        return 404;
    }
}
