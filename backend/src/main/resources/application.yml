server:
  port: 8080
  shutdown: graceful
  # Trust X-Forwarded-* from nginx. Without this the app still thinks it is
  # serving plain http on the container port, so a browser request whose
  # Origin is https://<domain> looks cross-origin to Spring -> the CORS filter
  # rejects every POST (login included) with 403 "Invalid CORS request".
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    threads:
      max: 80
    max-http-form-post-size: 10MB

spring:
  application:
    name: hospital-followup
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  reminder:
    # 提醒调度器：定时扫描待办并写待发记录（真正的弹窗由安卓端本地通知完成）
    enabled: true
    scan-interval-minutes: 10
    scan-interval-ms: 600000
    initial-delay-ms: 60000
  cors:
    # Origins allowed to call the API from a browser. The localhost entries are
    # for the dev servers; the real domain must be listed here as well, because
    # the Origin header a browser sends is not the scheme/host the container
    # sees behind the TLS-terminating nginx.
    allowed-origins: http://localhost:*,http://127.0.0.1:*,https://yisuifang.work,https://www.yisuifang.work
  # 数据加密密钥。生产环境务必用环境变量注入，并单独备份。
  crypto:
    data-key: ${APP_CRYPTO_DATA_KEY:dev-only-data-key-do-not-use-in-production}
    hash-pepper: ${APP_CRYPTO_HASH_PEPPER:dev-only-pepper-do-not-use-in-production}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123456789}
    expire-minutes: 480
  security:
    # 连续登录失败几次锁定
    login-max-fail: 5
    # 锁定时长（分钟）
    lock-minutes: 15
    # 查看完整手机号是否需要二次验证
    phone-view-reauth: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.hospital.followup: INFO
