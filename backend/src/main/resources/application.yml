server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    threads:
      max: 80
    max-http-form-post-size: 10MB

spring:
  application:
    name: hospital-followup
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  # 数据加密密钥。生产环境务必用环境变量注入，并单独备份。
  crypto:
    data-key: ${APP_CRYPTO_DATA_KEY:dev-only-data-key-do-not-use-in-production}
    hash-pepper: ${APP_CRYPTO_HASH_PEPPER:dev-only-pepper-do-not-use-in-production}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123456789}
    expire-minutes: 480
  security:
    # 连续登录失败几次锁定
    login-max-fail: 5
    # 锁定时长（分钟）
    lock-minutes: 15
    # 查看完整手机号是否需要二次验证
    phone-view-reauth: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.hospital.followup: INFO

